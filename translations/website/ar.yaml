# Arabic texts of reCAPTCHA for visitors (decision 0262).
"Please load reCAPTCHA first and confirm that you are not a robot.": "يُرجى تحميل reCAPTCHA أولًا وتأكيد أنك لست روبوتًا."
"Please load reCAPTCHA first, then send the form.": "يُرجى تحميل reCAPTCHA أولًا، ثم إرسال النموذج."
"Please confirm reCAPTCHA again.": "يُرجى تأكيد reCAPTCHA مرة أخرى."
"reCAPTCHA could not check the form. Please send it again.": "تعذّر على reCAPTCHA التحقق من النموذج. يُرجى إرساله مرة أخرى."
