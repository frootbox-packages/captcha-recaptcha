# German texts of reCAPTCHA: the settings, the captcha and the errors for visitors (decision 0262).
"reCAPTCHA": "reCAPTCHA"
"The keys and the version of reCAPTCHA for the forms": "Die Schlüssel und die Version von reCAPTCHA für die Formulare"
"Version": "Version"
"v2 shows a box \"I am not a robot\", v3 rates the visitor without a box. The keys belong to one version.": "v2 zeigt ein Kästchen „Ich bin kein Roboter“, v3 bewertet den Besucher ohne Kästchen. Die Schlüssel gehören zu einer Version."
"Site key": "Websiteschlüssel"
"Secret key": "Geheimer Schlüssel"
"The key for the website from the admin console of reCAPTCHA.": "Der Schlüssel für die Website aus der Admin-Konsole von reCAPTCHA."
"The secret key from the admin console of reCAPTCHA.": "Der geheime Schlüssel aus der Admin-Konsole von reCAPTCHA."
"Lowest score": "Niedrigste Punktzahl"
"For v3: an entry rated lower goes to the spam folder, from 0 (bot) to 1 (person).": "Für v3: Eine schlechter bewertete Einsendung kommt in den Spam-Ordner, von 0 (Bot) bis 1 (Mensch)."
"A check by Google. It loads at the form only after the visitor agrees; without it the form cannot be sent.": "Eine Prüfung von Google. Sie lädt am Formular erst, wenn der Besucher zustimmt; ohne sie lässt sich das Formular nicht senden."
"Please load reCAPTCHA first and confirm that you are not a robot.": "Bitte lade zuerst reCAPTCHA und bestätige, dass Du kein Roboter bist."
"Please load reCAPTCHA first, then send the form.": "Bitte lade zuerst reCAPTCHA und sende das Formular dann."
"Please confirm reCAPTCHA again.": "Bitte bestätige reCAPTCHA noch einmal."
"reCAPTCHA could not check the form. Please send it again.": "reCAPTCHA konnte das Formular nicht prüfen. Bitte sende es noch einmal."
